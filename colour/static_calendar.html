<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colour Calendar</title>
<style>
body, div {
    margin: 0;
    padding: 0;
    font-family: tahoma, sans-serif;
    font-size: 10pt;
}

#calendar {
        
    section.month {
        float: left;
        width: 105px;
    

        div.title {
            float: none;
            text-align: center;
            font-size: 12pt;
        }

        div.day {
            height: 15px;
            padding: 1px;
            margin-bottom: 1px;
            clear: left;

            .title {
                float: none;
                font-size: 10pt;
            }

            time.hour {
                display: block;
                float: left;
                width: 13px;
                height: 13px;
                padding: 1px;
                margin-bottom: 1px;
                font-size: 8pt;
            }
        }
    }

    #m01 { background-color: #0080FF; }
    #m02 { background-color: #00FFFF; }
    #m03 { background-color: #00FF80; }
    #m04 { background-color: #00FF00; }
    #m05 { background-color: #80FF00; }
    #m06 { background-color: #FFFF00; }
    #m07 { background-color: #FF8000; }
    #m08 { background-color: #FF0000; }
    #m09 { background-color: #FF0080; }
    #m10 { background-color: #FF00FF; }
    #m11 { background-color: #8000FF; }
    #m12 { background-color: #0000FF; }
}

    /* #0080FF 210     33023 */
    /* #00FFFF 180     65535 */
    /* #00FF80 150     65408 */
    /* #00FF00 120     65280 */
    /* #80FF00 90    8453888 */
    /* #FFFF00 60   16776960 */
    /* #FF8000 30   16744448 */
    /* #FF0000 0    16711680 */
    /* #FF0080 330  16711808 */
    /* #FF00FF 300  16711935 */
    /* #8000FF 270   8388863 */

    /*
        #m01 .d01 { background-color: #7C8084;}
        #m01 .d31 { background-color: #0080FF;}
        #m02 .d28 { background-color: #00FFFF;}
        #m03 .d31 { background-color: #00FF80;}
        #m04 .d30 { background-color: #00FF00;}
        #m05 .d31 { background-color: #80FF00;}
        #m06 .d30 { background-color: #FFFF00;}
        #m07 .d31 { background-color: #FF8000;}
        #m08 .d31 { background-color: #FF0000;}
        #m09 .d30 { background-color: #FF0080;}
        #m10 .d31 { background-color: #FF00FF;}
        #m11 .d30 { background-color: #8000FF;}
        #m12 .d31 { background-color: #0000FF;}
    */

</style>
<script>
const monthNames = [
    "Jan", "Feb", "Mar", "Apr", "May", "Jun",
    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
];

function andShade(month) {
    const id = String(month).padStart(2, "0"),
        color = getComputedStyle(document.querySelector(`#m${id}`)).backgroundColor,
        channels = color.match(/\d+/g).map(Number);

    return rgbToHsl({
        r: channels[0],
        g: channels[1],
        b: channels[2]
    });
}

function rgbToHsl(rgb) {
    const r = rgb.r / 255,
        g = rgb.g / 255,
        b = rgb.b / 255;
    const max = Math.max(r, g, b),
        min = Math.min(r, g, b),
        l = (max + min) / 2;
    let h = 0,
        s = 0;

    if (max !== min) {
        const difference = max - min;
        s = l > 0.5
            ? difference / (2 - max - min)
            : difference / (max + min);

        switch (max) {
            case r:
                h = (g - b) / difference + (g < b ? 6 : 0);
                break;
            case g:
                h = (b - r) / difference + 2;
                break;
            default:
                h = (r - g) / difference + 4;
                break;
        }

        h /= 6;
    }

    return [h, s, l];
}

function hslToRgb(h, s, l) {
    if (typeof h === "object" && s === undefined && l === undefined) {
        ({ h, s, l } = h);
    }

    const i = Math.floor(h * 6),
        f = h * 6 - i,
        p = l * (1 - s),
        q = l * (1 - f * s),
        t = l * (1 - (1 - f) * s);
    let r, g, b;

    switch (i % 6) {
        case 0: r = l; g = t; b = p; break;
        case 1: r = q; g = l; b = p; break;
        case 2: r = p; g = l; b = t; break;
        case 3: r = p; g = q; b = l; break;
        case 4: r = t; g = p; b = l; break;
        default: r = l; g = p; b = q; break;
    }

    return {
        r: Math.floor(r * 255),
        g: Math.floor(g * 255),
        b: Math.floor(b * 255)
    };
}

function shadeColor(color, percent) {
    const number = parseInt(color, 16),
        amount = Math.round(2.55 * percent),
        red = clampColor((number >> 16) - amount),
        green = clampColor(((number >> 8) & 0x00FF) - amount),
        blue = clampColor((number & 0x0000FF) - amount);

    return (0x1000000 + red * 0x10000 + green * 0x100 + blue)
        .toString(16)
        .slice(1);
}

function clampColor(value) {
    return Math.min(255, Math.max(0, value));
}

function createTimeElement(className, text, date) {
    const element = document.createElement("time");
    element.className = className;
    element.dateTime = date;
    element.textContent = text;
    return element;
}

function renderCalendar(year) {
    const calendar = document.querySelector("#calendar"),
        fragment = document.createDocumentFragment();

    for (let month = 0; month < 12; month++) {
        const monthNumber = String(month + 1).padStart(2, "0"),
            monthElement = document.createElement("section"),
            monthTitle = document.createElement("div"),
            daysInMonth = new Date(year, month + 1, 0).getDate();
        monthElement.className = "month";
        monthElement.id = `m${monthNumber}`;

        monthTitle.className = "title";
        monthTitle.textContent = monthNames[month];
        monthElement.append(monthTitle);

        for (let day = 1; day <= daysInMonth; day++) {
            const dayNumber = String(day).padStart(2, "0"),
                date = `${year}-${monthNumber}-${dayNumber}`;
            const dayElement = document.createElement("div"),
                dayTitle = document.createElement("div");
            dayElement.className = `day d${dayNumber}`;

            dayTitle.className = "title";
            dayTitle.textContent = dayNumber;
            dayElement.append(dayTitle);

            for (let hour = 0; hour < 24; hour++) {
                const hourNumber = String(hour).padStart(2, "0");
                dayElement.append(createTimeElement("hour h" + hourNumber, hourNumber, date));
            }

            monthElement.append(dayElement);
        }

        fragment.append(monthElement);
    }

    calendar.replaceChildren(fragment);
}

document.addEventListener("DOMContentLoaded", () => {
    renderCalendar(new Date().getFullYear());
});
    </script>
</head>
<body>
    <main id="calendar" aria-label="Colour calendar"></main>
</body>
</html>
