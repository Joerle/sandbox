<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What time is it?</title>
    <script src="../resources/jquery-4.0.0.min.js"></script>
    <script src="js/util.js"></script>
    <script src="js/convert.js"></script>
    <script src="js/colour.js"></script>
    <link rel="stylesheet" type="text/css" href="css/square.css" />
    <script>
jQuery(function () {
    jQuery(".refbody").hide();
    jQuery(".refnum").click(function (event) {
        jQuery(this.nextSibling).toggle();
        event.stopPropagation();
    });
    jQuery("body").click(function (event) {
        jQuery(".refbody").hide();
    });
});
</script>
</head>
<body>
<div id="console">
    <span>
        <input type="radio" name="mode" value="trad" checked>Traditional
        <span class="ref">
            <span class="refnum">[?]</span>
            <span class=""refbody" style="display:none;">Information</span>
        </span>
        
        <br />
        <input type="radio" name="mode" value="adpt">Adapted
    </span>
    <span id="dayOfYear"></span>
</div>

<div id="clock" class="clock">
<div id="center">
    <div id="hr">
        <div class="time">24</div>
        <div class="rgb">255</div>
        <div class="hex">FF</div>
        <div class="hue">359</div>
        <div id="min">
            <div class="time">15</div>
            <div class="rgb">255</div>
            <div class="hex">FF</div>
            <div class="hue">359</div>
            <div id="sec">
                <div class="time">59</div>
                <div class="rgb">255</div>
                <div class="hex">FF</div>
                <div class="hue">359</div>
                <div id="info">
                
                </div>
            </div>
        </div>
    </div>
</div>
</div>



</body>
</html>
